# 每周无条件编译一次 SBE1V1K 固件，消费 Track-Packages 已提交的 .github/packages.json。
# 无条件周编的理由：四股输入（上游 CI / 上游源码 / 外部依赖 / 本仓配置）
# 一周内几乎必然有变化，判断逻辑收益极低；且定期空跑能验证整条链路仍然可用。
#
# 编译后仅上传 Actions 构建产物，不创建或修改 Release。
name: 每周编译固件

on:
  schedule:
    - cron: '0 20 * * 6'   # 每周日 04:00 北京时间，排在跟踪流之后一天
  workflow_dispatch:

# 嵌套调用 reusable workflow 时，调用方权限必须不低于被调用方所需
permissions:
  contents: read
  actions: write

concurrency:
  group: sbe1v1k-build
  cancel-in-progress: false

jobs:
  build:
    name: 构建 SBE1V1K 固件
    uses: ./.github/workflows/QWRT-SBE1V1K.yml
    with:
      TEST: false
    secrets: inherit

  # 写入清单快照到固件内 /etc/qwrt-manifest.json（方案二）
  # 由 PRIVATE.sh 实现，在编译时随 files/ 覆盖层写入
  # 此处仅作确认标记
  manifest-in-firmware:
    name: 确认固件内清单
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 确认清单文件已就位
        run: |
          echo "清单快照将在编译时由 PRIVATE.sh 写入 files/etc/qwrt-manifest.json，随固件打包"
          echo "用户可在设备上执行: cat /etc/qwrt-manifest.json 查看"
